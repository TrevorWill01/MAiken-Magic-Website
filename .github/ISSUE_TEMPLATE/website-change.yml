name: Request a website change
description: Ask a maintainer to update the website. No GitHub experience needed.
title: "Website change: "
labels: ["website-change"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what to change and we will take care of it. Attach photos or logos in the box below.
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Home
        - About
        - Programs
        - Events
        - Sponsors
        - Join
        - FAQ
        - Contact
        - Something else
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Write it the way you would say it to a person. Include exact dates, names, and amounts.
      placeholder: "The GRITS event moved to November 6-8. Please update the events page."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Photos or logos
      description: Drag files into this box. Send the largest version you have.
    validations:
      required: false
